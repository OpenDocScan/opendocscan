name: Release

# Every tag, release candidates included. A `v0.1.0-rc.1` builds artifacts and
# attaches them to a prerelease; a bare `v0.1.0` does the same on a full
# release. Nothing here submits to a store.
#
# When a store workflow is added, it must trigger on `["v*", "!v*-*"]` — the
# negative glob drops anything with a hyphen, so a release candidate can never
# reach a store. That split is the whole safety mechanism; keep it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          # cargokit cross-compiles the core for every ABI in the APK. Without
          # these the Gradle build fails inside the Rust step, which reads like
          # a Gradle problem and is not one.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Rust tests
        run: cargo test --workspace

      - name: Flutter analyze and host tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build the APK
        working-directory: app
        # Debug-signed, deliberately: there is no upload keystore in this repo
        # and there should not be one until a store submission is actually
        # planned — the key can never be rotated afterwards. A release
        # candidate is sideloaded, and a debug-signed APK sideloads fine.
        run: flutter build apk --release

      - name: Name it after the tag
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             "dist/OpenDocScan-${GITHUB_REF_NAME}.apk"
          sha256sum "dist/OpenDocScan-${GITHUB_REF_NAME}.apk" \
            > "dist/OpenDocScan-${GITHUB_REF_NAME}.apk.sha256"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # A tag containing a hyphen is a release candidate. Without this it
          # would be marked "Latest" and become the download the README points
          # at.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
