[package]
name = "docscan-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
docscan-core = { path = "../docscan-core" }
docscan-detect = { path = "../docscan-detect" }
docscan-transform = { path = "../docscan-transform" }
docscan-filters = { path = "../docscan-filters" }
docscan-ocr = { path = "../docscan-ocr" }
docscan-pdf = { path = "../docscan-pdf" }
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pinned exact: the `wasm-bindgen` crate and the `wasm-bindgen-cli` binary
# share a versioned JS-glue schema and must match. Install the CLI with
# `cargo install wasm-bindgen-cli --version 0.2.126 --locked` and keep the
# two in lockstep — the same rule the other WASM apps in this monorepo
# follow.
wasm-bindgen = "=0.2.126"
console_error_panic_hook = "0.1"
